<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Kitchenware Rentals</title>
  <link rel="icon" type="image/svg+xml" href="src/favicon.svg" />
  <link rel="apple-touch-icon" href="src/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css" />
  <link rel="stylesheet" href="css/login.css" />
</head>

<body>

  <div class="login-card">
    <div class="brand">
      <div class="brand-logo-wrap">
        <img src="src/logo-mark.png" alt="Kitchenware Rentals Logo" class="brand-logo-img" />
      </div>
      <h1>Kitchenware</h1>
      <p class="brand-sub">RENTALS LTD</p>
      <p class="brand-desc">ERP &amp; Hire Management System</p>
    </div>

    <div id="error-msg">Invalid email or password.</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@kitchenwarerentals.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">SIGN IN TO WORKSPACE</button>
    </form>

    <div class="demo-section">
      <p class="demo-title">⚡ Quick Demo Access by Role</p>
      <div class="demo-grid">
        <button type="button" data-demo-role="super_admin" class="demo-role-btn role-super">👑 Super Admin</button>
        <button type="button" data-demo-role="data_entry" class="demo-role-btn role-data">📝 Data Entry</button>
        <button type="button" data-demo-role="invoicing" class="demo-role-btn role-inv">🧾 Invoicing</button>
        <button type="button" data-demo-role="analyst" class="demo-role-btn role-analyst">📊 Analyst</button>
      </div>
    </div>

    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js?v=45"></script>
  <script src="js/login.js?v=45"></script>
</body>
</html>
