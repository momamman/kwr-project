<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Kitchenware Rentals</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --red:        #7B1515;
      --red-dark:   #4e0d0d;
      --red-light:  #f5ecec;
      --bg:         #eef0f4;
      --card:       #ffffff;
      --border:     #dde1e7;
      --text:       #1e2732;
      --muted:      #6b7280;
      --radius:     14px;
      --shadow-md:  0 4px 24px rgba(0,0,0,.09);
    }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
    }

    .login-card {
      background: var(--card);
      width: 100%;
      max-width: 400px;
      padding: 40px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border-top: 4px solid var(--red);
    }

    .brand {
      text-align: center;
      margin-bottom: 30px;
    }

    .brand h1 {
      font-size: 24px;
      color: var(--red);
      letter-spacing: 2px;
      text-transform: uppercase;
      margin-top: 10px;
    }

    .field {
      margin-bottom: 20px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
    }

    input {
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: border-color .18s;
    }

    input:focus {
      border-color: var(--red);
    }

    .btn {
      width: 100%;
      padding: 12px;
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background .18s;
      margin-top: 10px;
    }

    .btn:hover {
      background: var(--red-dark);
    }

    #error-msg {
      color: #ef4444;
      font-size: 13px;
      text-align: center;
      margin-bottom: 15px;
      display: none;
    }

    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.5);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      border-radius: var(--radius);
    }

    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div style="font-size: 40px;">🍴</div>
      <h1>Kitchenware</h1>
      <p style="font-size: 10px; letter-spacing: 4px; color: var(--muted); text-transform: uppercase;">Rentals</p>
    </div>

    <div id="error-msg">Invalid email or password.</div>

    <form id="loginForm">
      <div class="field">
        <label>Email Address</label>
        <input type="email" id="email" required placeholder="name@example.com" />
      </div>
      <div class="field">
        <label>Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">LOG IN</button>
    </form>

    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('error-msg');

    form.onsubmit = async (e) => {
      e.preventDefault();
      loading.style.display = 'flex';
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await auth.login(email, password);
        
        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
        } else {
          // Success! auth.js will check the session and redirect window.location.href = 'index.html'; below works for direct flow
          window.location.href = 'index.html';
        }
      } catch (err) {
        errorMsg.textContent = 'An unexpected error occurred.';
        errorMsg.style.display = 'block';
      } finally {
        loading.style.display = 'none';
      }
    };

    // Redirect if already logged in
    (async () => {
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    })();
  </script>
</body>
</html>
