<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login — Kitchenware Rentals</title>
  <link rel="icon" type="image/svg+xml" href="src/favicon.svg" />
  <link rel="apple-touch-icon" href="src/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --berry:        #A71265;
      --berry-dark:   #840D4F;
      --berry-light:  #FDF2F7;
      --espresso:     #57463B;
      --espresso-dark:#3A2E27;
      --forest:       #3D5348;
      --forest-dark:  #2B3C34;
      --bg:           #F5F1EB;
      --card:         #FFFFFF;
      --border:       #E8E2D9;
      --border-focus: #A71265;
      --text:         #1C1814;
      --muted:        #6F675C;
      --radius:       18px;
      --shadow-md:    0 12px 36px rgba(44, 32, 26, 0.08), 0 2px 8px rgba(44, 32, 26, 0.04);
    }

    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(167, 18, 101, 0.05) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(87, 70, 59, 0.06) 0px, transparent 50%);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px 16px;
    }

    .login-card {
      background: var(--card);
      width: 100%;
      max-width: 420px;
      padding: 44px 36px;
      border-radius: var(--radius);
      box-shadow: var(--shadow-md);
      border: 1px solid var(--border);
      position: relative;
      overflow: hidden;
    }

    /* Dual brand color top accent bar matching the logo */
    .login-card::before {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 5px;
      background: linear-gradient(90deg, var(--espresso) 0%, var(--espresso) 50%, var(--berry) 50%, var(--berry) 100%);
    }

    .brand {
      text-align: center;
      margin-bottom: 32px;
    }

    .brand-logo-wrap {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }

    .brand-logo-img {
      width: 68px;
      height: auto;
      object-fit: contain;
      filter: drop-shadow(0 2px 8px rgba(87, 70, 59, 0.15));
    }

    .brand h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26px;
      font-weight: 700;
      color: var(--espresso);
      letter-spacing: 0.5px;
      line-height: 1.2;
    }

    .brand-sub {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      letter-spacing: 4px;
      color: var(--berry);
      text-transform: uppercase;
      font-weight: 700;
      margin-top: 5px;
    }

    .brand-desc {
      font-size: 12px;
      color: var(--muted);
      margin-top: 8px;
    }

    .field {
      margin-bottom: 18px;
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field label {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.8px;
      color: var(--muted);
    }

    input {
      border: 1.5px solid var(--border);
      background: #FAF7F2;
      border-radius: 10px;
      padding: 12px 14px;
      font-size: 14px;
      color: var(--text);
      outline: none;
      transition: all .2s ease;
      font-family: inherit;
    }

    input:focus {
      background: #FFFFFF;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(167, 18, 101, 0.12);
    }

    .btn {
      width: 100%;
      padding: 13px;
      background: var(--forest);
      color: #fff;
      border: none;
      border-radius: 10px;
      font-size: 13.5px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      letter-spacing: 0.5px;
      cursor: pointer;
      transition: all .2s ease;
      margin-top: 10px;
      box-shadow: 0 4px 12px rgba(61, 83, 72, 0.25);
    }

    .btn:hover {
      background: var(--forest-dark);
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(61, 83, 72, 0.32);
    }

    .btn:active {
      transform: translateY(0);
    }

    #error-msg {
      background: #FDF2F2;
      border: 1px solid #FCA5A5;
      color: #B91C1C;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 12.5px;
      text-align: center;
      margin-bottom: 18px;
      display: none;
    }

    .demo-section {
      margin-top: 28px;
      padding-top: 22px;
      border-top: 1px solid var(--border);
      text-align: center;
    }

    .demo-title {
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 12px;
      letter-spacing: 1px;
    }

    .demo-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .demo-role-btn {
      padding: 9px 8px;
      font-size: 11.5px;
      font-family: 'Outfit', sans-serif;
      font-weight: 700;
      border: none;
      border-radius: 8px;
      color: #fff;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .demo-role-btn:hover {
      opacity: 0.92;
      transform: translateY(-1px);
    }

    .role-super { background: #D97706; }
    .role-data  { background: var(--forest); }
    .role-inv   { background: var(--berry); }
    .role-analyst { background: var(--espresso); }

    .loading-overlay {
      position: absolute;
      inset: 0;
      background: rgba(255,255,255,0.75);
      backdrop-filter: blur(2px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      border-radius: var(--radius);
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid rgba(167, 18, 101, 0.2);
      border-top-color: var(--berry);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>

  <div class="login-card">
    <div class="brand">
      <div class="brand-logo-wrap">
        <img src="src/logo-mark.png" alt="Kitchenware Rentals Logo" class="brand-logo-img" />
      </div>
      <h1>Kitchenware</h1>
      <p class="brand-sub">RENTALS LTD</p>
      <p class="brand-desc">ERP &amp; Hire Management System</p>
    </div>

    <div id="error-msg">Invalid email or password.</div>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email Address</label>
        <input type="email" id="email" required placeholder="name@kitchenwarerentals.com" />
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" required placeholder="••••••••" />
      </div>
      <button type="submit" class="btn">SIGN IN TO WORKSPACE</button>
    </form>

    <div class="demo-section">
      <p class="demo-title">⚡ Quick Demo Access by Role</p>
      <div class="demo-grid">
        <button type="button" onclick="auth.loginAsDemo('super_admin')" class="demo-role-btn role-super">👑 Super Admin</button>
        <button type="button" onclick="auth.loginAsDemo('data_entry')" class="demo-role-btn role-data">📝 Data Entry</button>
        <button type="button" onclick="auth.loginAsDemo('invoicing')" class="demo-role-btn role-inv">🧾 Invoicing</button>
        <button type="button" onclick="auth.loginAsDemo('analyst')" class="demo-role-btn role-analyst">📊 Analyst</button>
      </div>
    </div>

    <div class="loading-overlay" id="loading">
      <div class="spinner"></div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const loading = document.getElementById('loading');
    const errorMsg = document.getElementById('error-msg');

    form.onsubmit = async (e) => {
      e.preventDefault();
      loading.style.display = 'flex';
      errorMsg.style.display = 'none';

      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const { data, error } = await auth.login(email, password);
        
        if (error) {
          errorMsg.textContent = error.message;
          errorMsg.style.display = 'block';
        } else {
          // Success! auth.js will check the session and redirect window.location.href = 'index.html'; below works for direct flow
          window.location.href = 'index.html';
        }
      } catch (err) {
        errorMsg.textContent = 'An unexpected error occurred.';
        errorMsg.style.display = 'block';
      } finally {
        loading.style.display = 'none';
      }
    };

    // Redirect if already logged in or demo specified in URL
    (async () => {
      const urlParams = new URLSearchParams(window.location.search);
      const demoParam = urlParams.get('demo');
      if (demoParam === 'admin' || demoParam === 'user') {
        auth.loginAsDemo(demoParam);
        return;
      }
      const demoUser = localStorage.getItem('kwr_demo_user');
      if (demoUser) {
        window.location.href = 'index.html';
        return;
      }
      const { data: { session } } = await db.auth.getSession();
      if (session) {
        window.location.href = 'index.html';
      }
    })();
  </script>
</body>
</html>
