<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Management — Kitchenware Rentals Admin</title>
  <link rel="icon" type="image/svg+xml" href="src/favicon.svg" />
  <link rel="apple-touch-icon" href="src/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,600;0,700;1,600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --berry:        #A71265;
      --berry-dark:   #840D4F;
      --berry-light:  #FDF2F7;
      --espresso:     #57463B;
      --espresso-dark:#3A2E27;
      --forest:       #3D5348;
      --forest-dark:  #2B3C34;
      --forest-light: #EEF3F0;
      --bg:           #F5F1EB;
      --card:         #FFFFFF;
      --border:       #E8E2D9;
      --border-focus: #A71265;
      --text:         #1C1814;
      --muted:        #6F675C;
      --radius:       16px;
      --shadow-md:    0 8px 30px rgba(44, 32, 26, 0.07);
    }
    body {
      font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      background: var(--bg);
      background-image: 
        radial-gradient(at 0% 0%, rgba(167, 18, 101, 0.04) 0px, transparent 50%),
        radial-gradient(at 100% 100%, rgba(87, 70, 59, 0.05) 0px, transparent 50%);
      color: var(--text);
      padding: 40px 20px 60px;
      min-height: 100vh;
    }
    .container { max-width: 860px; margin: 0 auto; }
    .header { 
      display: flex; 
      justify-content: space-between; 
      align-items: center; 
      margin-bottom: 28px;
      flex-wrap: wrap;
      gap: 16px;
    }
    .header-brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }
    .header-logo {
      width: 44px;
      height: 44px;
      object-fit: contain;
    }
    .header h1 {
      font-family: 'Playfair Display', Georgia, serif;
      font-size: 26px;
      color: var(--espresso);
      font-weight: 700;
    }
    .header p {
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: var(--berry);
      font-weight: 700;
    }
    .btn {
      padding: 10px 18px; 
      border-radius: 8px; 
      font-weight: 700; 
      cursor: pointer; 
      border: none; 
      font-family: 'Outfit', sans-serif;
      font-size: 13px;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
      text-decoration: none;
    }
    .btn-berry { 
      background: var(--berry); 
      color: #fff; 
      box-shadow: 0 4px 12px rgba(167, 18, 101, 0.25);
    }
    .btn-berry:hover { 
      background: var(--berry-dark); 
      transform: translateY(-1px);
    }
    .btn-forest {
      background: var(--forest);
      color: #fff;
      box-shadow: 0 4px 12px rgba(61, 83, 72, 0.22);
    }
    .btn-forest:hover {
      background: var(--forest-dark);
      transform: translateY(-1px);
    }
    .btn-ghost { 
      background: #fff; 
      border: 1.5px solid var(--border); 
      color: var(--espresso);
    }
    .btn-ghost:hover {
      background: #FAF7F2;
      border-color: var(--espresso);
    }
    .card { 
      background: var(--card); 
      padding: 32px 36px; 
      border-radius: var(--radius); 
      box-shadow: var(--shadow-md); 
      margin-bottom: 28px; 
      border: 1px solid var(--border);
    }
    h2 { 
      margin-bottom: 20px; 
      color: var(--espresso); 
      font-family: 'Outfit', sans-serif;
      font-size: 16px; 
      text-transform: uppercase; 
      letter-spacing: 1px;
      font-weight: 800;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    h2::before {
      content: '';
      display: inline-block;
      width: 4px;
      height: 18px;
      background: var(--berry);
      border-radius: 2px;
    }
    .field { margin-bottom: 15px; display: flex; flex-direction: column; gap: 6px; }
    .field label { 
      font-size: 11px; 
      font-weight: 700; 
      text-transform: uppercase; 
      letter-spacing: 0.6px;
      color: var(--muted); 
    }
    input, select { 
      border: 1.5px solid var(--border); 
      background: #FAF7F2;
      padding: 10px 14px; 
      border-radius: 8px; 
      width: 100%; 
      font-family: inherit;
      font-size: 13.5px;
      color: var(--text);
      outline: none;
      transition: all 0.2s ease;
    }
    input:focus, select:focus {
      background: #FFFFFF;
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(167, 18, 101, 0.12);
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th { 
      text-align: left; 
      padding: 12px 14px; 
      border-bottom: 2px solid var(--border); 
      font-size: 11px; 
      font-weight: 700;
      text-transform: uppercase; 
      letter-spacing: 0.8px;
      color: var(--muted); 
      background: #FAF7F2;
    }
    td { padding: 13px 14px; border-bottom: 1px solid var(--border); font-size: 13.5px; }
    tr:hover td { background: #FCFAF7; }
  </style>
</head>
<body>
  <div class="container">
    <div class="header">
      <div class="header-brand">
        <img src="src/logo-mark.png" alt="Kitchenware Rentals Logo" class="header-logo" />
        <div>
          <h1>User Management</h1>
          <p>Kitchenware Rentals Access Administration</p>
        </div>
      </div>
      <a href="index.html" class="btn btn-ghost">← Back to Workspace</a>
    </div>

    <div class="card">
      <h2>Create New User</h2>
      <form id="createUserForm">
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 16px;">
          <div class="field">
            <label for="newName">Full Name</label>
            <input type="text" id="newName" required placeholder="John Doe">
          </div>
          <div class="field">
            <label for="newEmail">Email Address</label>
            <input type="email" id="newEmail" required placeholder="john@kitchenwarerentals.com">
          </div>
          <div class="field">
            <label for="newPassword">Password</label>
            <input type="password" id="newPassword" required placeholder="••••••••">
          </div>
          <div class="field">
            <label for="newRole">Role / Access Profile</label>
            <select id="newRole">
              <option value="super_admin">👑 Super Admin (All Tabs)</option>
              <option value="data_entry">📝 Data Entry Profile</option>
              <option value="invoicing">🧾 Invoicing & Transaction Profile</option>
              <option value="analyst">📊 Analysis Profile</option>
            </select>
          </div>
        </div>
        <button type="submit" class="btn btn-forest" style="margin-top: 12px;">Create User Account</button>
      </form>
    </div>

    <div class="card">
      <h2>Existing Users</h2>
      <table id="usersTable">
        <thead>
          <tr>
            <th>Name</th>
            <th>Email</th>
            <th>Role</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="3" style="text-align: center; color: var(--muted);">Loading users...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/db.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async function init() {
      const authData = await auth.checkAuth('admin');
      if (!authData) return;

      loadUsers();
    })();

    async function loadUsers() {
      const { data: users, error } = await db
        .from('profiles')
        .select('*')
        .order('full_name', { ascending: true });

      if (error) {
        console.error('Error loading users:', error);
        return;
      }

      // Note: profiles table doesn't have email by default in my script, 
      // but the trigger sets full_name to email if meta is empty.
      // To get emails, we would need to join with auth.users which is restricted.
      // However, we can use the 'user' metadata if we have it or just show names.
      // For this demo, let's assume we want to show emails if we can.
      
      const tbody = document.querySelector('#usersTable tbody');
      function getRoleBadge(role) {
        if (role === 'admin' || role === 'super_admin') {
          return `<span style="background: #FEF3C7; color: #92400E; border: 1px solid #FDE68A; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">👑 Super Admin</span>`;
        } else if (role === 'data_entry') {
          return `<span style="background: #E2ECE7; color: #2F4339; border: 1px solid #C4D9CD; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">📝 Data Entry</span>`;
        } else if (role === 'invoicing') {
          return `<span style="background: #FDF2F7; color: #A71265; border: 1px solid #F5C6DF; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">🧾 Invoicing</span>`;
        } else if (role === 'analyst') {
          return `<span style="background: #EFE9E1; color: #57463B; border: 1px solid #DDD3C5; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">📊 Analyst</span>`;
        }
        return `<span style="background: #F3EFE9; color: #6F675C; border: 1px solid #E5DFD7; padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px;">${role || 'USER'}</span>`;
      }

      tbody.innerHTML = users.map(u => `
        <tr>
          <td><strong style="color: var(--text);">${u.full_name || 'N/A'}</strong></td>
          <td style="color: var(--muted);">${u.full_name && u.full_name.includes('@') ? u.full_name : 'N/A'}</td>
          <td>${getRoleBadge(u.role)}</td>
        </tr>
      `).join('');
    }

    document.getElementById('createUserForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = document.getElementById('newEmail').value;
      const password = document.getElementById('newPassword').value;
      const full_name = document.getElementById('newName').value;
      const role = document.getElementById('newRole').value;

      // Note: Supabase signUp will automatically be handled by our trigger
      // BUT signUp usually signs in the new user immediately unless we use service role.
      // For a client-side admin panel, we can use db.auth.signUp
      // but it might sign out the admin. To prevent this, we should ideally use an Edge Function.
      // Given the simple setup, I'll use signUp and explain it might need a re-login if not configured.
      // Actually, Supabase has an 'inviteUserByEmail' but that's different.
      
      const { data, error } = await db.auth.signUp({
        email,
        password,
        options: {
          data: { full_name, role }
        }
      });

      if (error) {
        alert('Error creating user: ' + error.message);
      } else {
        alert('User created successfully!');
        document.getElementById('createUserForm').reset();
        loadUsers();
      }
    };
  </script>
</body>
</html>
